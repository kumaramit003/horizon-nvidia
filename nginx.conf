server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Discovery pipeline can take minutes (6 parallel reasoning-model calls).
    # Default nginx proxy timeouts are 60s — bump them generously.
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    send_timeout          600s;
    # Disable buffering so streaming responses (TTS audio) flush promptly.
    proxy_buffering off;

    location /api/ {
        # Resolve the backend hostname at request time via Docker's embedded
        # DNS (127.0.0.11). With a literal `proxy_pass http://backend:8000`,
        # nginx resolves the IP ONCE at startup and caches it — so when the
        # backend container is recreated and gets a new IP, nginx keeps hitting
        # the stale address and returns 502. Using a resolver + a variable
        # forces re-resolution so the stack survives a backend restart.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow larger uploads for audio (STT) — webm chunks can be a few MB.
        client_max_body_size 25m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
