services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # Host binding moved to 8001 so we don't collide with the NIM, which
    # also listens on 8000. Inside the docker network the backend still
    # uses port 8000 (that's what nginx in the frontend container proxies to).
    ports:
      - "8001:8000"
    # Allow the backend container to reach a NIM running on the docker host
    # (set NVIDIA_BASE_URL=http://host.docker.internal:8000/v1 in .env if so).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # MongoDB
      - MONGODB_URL=mongodb://mongo:27017
      - DATABASE_NAME=${DATABASE_NAME:-founderos}
      # Nemotron (NVIDIA NIM or any OpenAI-compatible endpoint)
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-not-needed}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-nvidia/nemotron-3-nano-omni-30b-a3b-reasoning}
      # ElevenLabs TTS (Flora + Finn voices). Leave blank to skip voice playback.
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID_FLORA=${ELEVENLABS_VOICE_ID_FLORA:-}
      - ELEVENLABS_VOICE_ID_FINN=${ELEVENLABS_VOICE_ID_FINN:-}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID:-eleven_flash_v2_5}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: .
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  mongo_data:
